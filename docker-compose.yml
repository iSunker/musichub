# Musopia 全自动流水线。
#
# 一个常驻容器跑 daemon.py，按各自周期串行调度七个阶段：
#   scan -> publish -> sync -> covers -> edit -> vtid -> crawl
# （vtid = 从 vertex2 库按 infohash 拿皇后页面 id，**纯本地零请求**，默认开；
#  crawl = 按那些 id 抓皇后详情页补 mapped_json，★ 默认关闭，要开需 ENABLE_CRAWL=true。
#  它只入库、**不会**产生新发布 —— 理由见 daemon.py 里各自的注释段。）
# ★ 2026-09-23：原先的「扫 qB → 按种子名称搜索皇后」那条路**已整条删除**，
#   id 现在一律来自 vtid 阶段（实测按 infohash 命中 430/547，按名字只有 1/547）。
# 其余 service 都带 profiles，平时不启动，只用于手动跑一次性命令。
#
# ★★ project 名**写死在这里**（顶层 `name:`），不靠目录名推断。
#   2026-09-22 实测踩坑：原先 project 名取自目录名，而该容器当年是以
#   `-p musopia` 起的 ⇒ 容器 label 是 `musopia`、而 `cd 目录 && compose down`
#   算出来的是 `musopia_script2` ⇒ **两个 project 互不认识**：
#     · `down` 报 "No resource found for project musopia_script2"（什么都没删）
#     · `up`  想创建 container_name，撞上那个"不属于本 project"的同名容器 ⇒ 冲突死锁
#   写死顶层 `name:` 后，无论从哪个目录、谁跑 compose，project 名都恒定，
#   这类"清不掉 / 撞名"的问题**从机制上消失**。
#   ★ 纪律：改 project 名 = 换一套记账，必须 `docker rm -f` 旧容器再 up。
name: opencd2musopia

# 为什么是单容器而不是五个：
#   各阶段共用一个 SQLite，多容器各自定时会撞上并发写（database is locked），
#   而且"发布还没跑完就开始编辑"这种交叉执行会读到半成品数据。
#   daemon.py 串行调度天然规避了这两个问题。

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: musopia-script:latest
  env_file: .env
  environment: &common-env
    # 状态目录统一指向 /data（下面 bind mount 过来的宿主机目录）
    - DATA_DIR=/data
    # network_mode: host 下没有 host.docker.internal 这条特殊 DNS 记录，
    # 容器直接共享宿主机网络栈，所以用宿主机自己访问 qB 的真实地址。
    - QB_HOST=${QB_HOST:-http://127.0.0.1:3020}
    # ★ 上面那个只读挂载的落点。`sync_opencd_tid.py` 读它（容器内路径）。
    #   写在这里而不是 .env：它是**挂载点的配对**，改一处不改另一处必然出错；
    #   放同一份文件里，改挂载的人一定看得见它。（.env 里另有 VERTEX_DB 的
    #   同名键只为本机跑自检用，两者互不覆盖 —— 本地 .env 不进容器。）
    - VERTEX_DB=/vertex/sql.db
  volumes: &common-volumes
    # 状态（data.db / output_torrents / daemon_state.json）放在脚本目录，
    # 而不是匿名命名卷：SMB 上直接看得到、能备份，出问题也能直接查库。
    # 那份已经回填好 254 个站点 ID 的 data.db 就在这里，不需要任何迁移。
    - ${STATE_DIR:-.}:/data
    # 抽元数据、找封面要读音乐文件，只读挂载
    - ${MUSIC_DIR:-/volume1/video/music}:/downloads:ro
    - ${INCOMPLETE_DIR:-/volume2/qb_temp/temp_docker_opencd}:/downloads/incomplete:ro
    # ★★ vertex2（另一个项目）的库，只读挂进来 —— `sync_opencd_tid.py` 靠它按
    #   infohash 找出皇后的 `details.php?id=`。它是本项目**唯一的 id 来源**。
    #   ★ 挂的是**目录**不是文件：sync_opencd_tid.py 期望的路径是
    #     `/vertex/sql.db`（库会和它旁边的 -wal/-shm 一起被 SQLite 用到，
    #     只挂单个文件会漏掉那两个伴随文件）。
    #   ★ `:ro` 是硬要求 —— 我们**没有任何理由**写别人的库，而只读挂载让
    #     "手滑写坏 vertex2" 从"靠自律"变成"内核拒绝"。SQLite 打开时还会
    #     自己加 `mode=ro` + `query_only=1`（见该脚本纪律 5），双保险。
    #   ★ 默认值是**部署时实测过的**；对不上就报 `外部库不存在` 而非静默跳过
    #     （该脚本纪律 4：源读不到 ⇒ 非零退出）。
    - ${VERTEX_DB_DIR:-/volume2/docker_ssd/vertex2/vertex/db}:/vertex:ro
  # 共享宿主机网络：既能到 127.0.0.1 的 qB，也能正常出网访问站点和图床
  network_mode: "host"

services:
  # ==================== 常驻编排器（唯一需要长期运行的） ====================
  musopia:
    <<: *common
    container_name: opencd2musopia
    command: ["python", "daemon.py"]
    restart: unless-stopped

    # 收到 SIGTERM 后 daemon 会等当前阶段收尾再退出。默认 10s 往往不够
    # （一次编辑请求 + 校验回读可能十几秒），硬杀会留下改了一半的页面。
    stop_grace_period: 5m

    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3

    # 日志别无限涨，NAS 上很容易被慢慢填满
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ==================== qB 下载调度器（常驻 · 默认关闭）====================
  # ★ 与 daemon 并列的**第二个常驻容器**：daemon 管"发布到站点"，本服务只管
  #   "qB(3020) 里的下载怎么排队/怎么分带宽"，互不 import、互不阻塞。
  #   为什么独立而不是塞进 daemon.py：daemon 的阶段是**同步阻塞**的（单阶段最长
  #   STAGE_TIMEOUT=3600s），60s 的调优节拍会被别的阶段饿死（见 daemon.py run_main_loop）。
  # ★ 它**不写 data.db**（本文件顶部纪律：共享 SQLite 不许两个容器并发写，
  #   ERR-DOCKER-03）—— 状态落在 /data/qbtune_state.json，心跳落 /data/qbtune_heartbeat
  #   （与 daemon_heartbeat 分开，两个主体各一份，同名会互相覆盖）。
  # ★ 默认 QBTUNE_ENABLE=false ⇒ 起来也只读、不写 qB（先 --dry-run 看计划）。
  #   要真跑：NAS 的 .env 里设 QBTUNE_ENABLE=true（ERR-ENV-02：本机 .env 不进容器）。
  # ★ 刻意**不写 `environment:`**：`*common-env` 是**覆盖**语义，写了会把
  #   DATA_DIR / QB_HOST / VERTEX_DB 全丢掉 —— QBTUNE_* 一律经 env_file(.env) 传入。
  qbtune:
    <<: *common
    container_name: musopia_qbtune
    command: ["python", "tools/qbtune.py", "--loop"]
    restart: unless-stopped
    # 本服务无长任务，一轮最多几秒 ⇒ 5s 足够（别照抄 musopia 的 5m，那是给
    # "一次编辑请求 + 校验回读"留的）。
    stop_grace_period: 5s
    healthcheck:
      # ★ **不复用**根级 healthcheck.py —— 它硬编码读 daemon_heartbeat，会让
      #   qbtune 的健康取决于 daemon（看门狗互锁）。本服务自带 --healthcheck
      #   分支读自己的心跳。
      test: ["CMD", "python", "tools/qbtune.py", "--healthcheck"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ==================== 以下都是手动一次性任务 ====================
  # 加了 profiles 就不会被 docker compose up 带起来，只能显式 run。
  # 用法示例：
  #   docker compose run --rm tools python check_db.py
  #   docker compose run --rm tools python sync_site.py --apply
  #   docker compose run --rm tools python update_metadata.py 14611 --apply --verify
  tools:
    <<: *common
    profiles: ["tools"]
    container_name: musopia_tools
    command: ["python", "check_db.py"]
    restart: "no"

  # 只跑一轮全部阶段就退出（首次部署时验证配置对不对，比直接常驻更容易看结果）
  once:
    <<: *common
    profiles: ["tools"]
    container_name: musopia_once
    command: ["python", "daemon.py"]
    restart: "no"
    environment:
      - DATA_DIR=/data
      - QB_HOST=${QB_HOST:-http://127.0.0.1:3020}
      # 全阶段跑一轮后就不再有到期任务；配合 DRY_RUN=true 可做无副作用演练
      - RUN_ON_START=true
      - DRY_RUN=${DRY_RUN:-true}
