# Musopia 全自动流水线。
#
# 一个常驻容器跑 daemon.py，按各自周期串行调度七个阶段：
#   scan -> publish -> sync -> covers -> edit -> vtid -> crawl
# （vtid = 从 vertex2 库按 infohash 拿皇后页面 id，**纯本地零请求**，默认开；
#  crawl = 按那些 id 抓皇后详情页补 mapped_json，★ 默认关闭，要开需 ENABLE_CRAWL=true。
#  它只入库、**不会**产生新发布 —— 理由见 daemon.py 里各自的注释段。）
# ★ 2026-09-23：原先的「扫 qB → 按种子名称搜索皇后」那条路**已整条删除**，
#   id 现在一律来自 vtid 阶段（实测按 infohash 命中 430/547，按名字只有 1/547）。
# 其余 service 都带 profiles，平时不启动，只用于手动跑一次性命令。
#
# ★★ project 名**写死在这里**（顶层 `name:`），不靠目录名推断。
#   2026-09-22 实测踩坑：原先 project 名取自目录名，而该容器当年是以
#   `-p musopia` 起的 ⇒ 容器 label 是 `musopia`、而 `cd 目录 && compose down`
#   算出来的是 `musopia_script2` ⇒ **两个 project 互不认识**：
#     · `down` 报 "No resource found for project musopia_script2"（什么都没删）
#     · `up`  想创建 container_name，撞上那个"不属于本 project"的同名容器 ⇒ 冲突死锁
#   写死顶层 `name:` 后，无论从哪个目录、谁跑 compose，project 名都恒定，
#   这类"清不掉 / 撞名"的问题**从机制上消失**。
#   ★ 纪律：改 project 名 = 换一套记账，必须 `docker rm -f` 旧容器再 up。
name: opencd2musopia

# 为什么是单容器而不是五个：
#   各阶段共用一个 SQLite，多容器各自定时会撞上并发写（database is locked），
#   而且"发布还没跑完就开始编辑"这种交叉执行会读到半成品数据。
#   daemon.py 串行调度天然规避了这两个问题。

x-common: &common
  # ★★ 2026-10-06：构建**移到本机**（`bash build-push.sh` → 推 Docker Hub），NAS 只 `pull` + `up -d`。
  #   原先这里是 `build: {context: ., dockerfile: Dockerfile}` —— 那要求 NAS 上
  #   有一份完整的构建上下文（27 个 .py + tools/ + Dockerfile），且 NAS 出网受限
  #   （实测 `registry-1.docker.io` 直连不可达，需走代理）⇒ 构建脆弱。详见 README「部署与构建」。
  #   ★ 删掉 build: 之后，NAS 顶层不再需要 .py / tools/ / Dockerfile / .dockerignore。
  #   ★ `.dockerignore` 仍留在**本机**（本机构建的上下文 = 本仓库，凭据排除照旧生效）。
  #   ★ 公开库 ⇒ NAS 拉取**无需 login**。
  #   ★★ 2026-10-04（ERR-DOCKER-13）：**部署时把这里改成 `:<git-sha>` tag**，别留 `latest`。
  #      NAS 的 `registry-mirrors` 会**缓存 `latest` 这个可变 tag**（实测滞后约 1 小时）
  #      ⇒ `compose pull` 静默拿到旧镜像、还回 "Image is up to date"（看着全成功）。
  #      不可变引用（`:<sha>` / `@sha256:…`）绕过镜像站 tag 缓存 ⇒ 立刻拿到新镜像。
  #      ★ 本机 `build-push.sh` 会 push `:latest` + `:<git-sha>`；部署点名后者。
  image: isunker/opencd2others:latest
  # ★★ pull_policy 可配置（2026-10-07 #134 直传部署）：
  #   · 需要**走 Docker Hub**（`build-push.sh` 推 → NAS `pull`）⇒ 在 `.env` 里设
  #     `PULL_POLICY=always`（必须总是拉，否则本地已有同名 tag 时 `up -d` 不会去拉，
  #     症状同 ERR-DOCKER-01："push 了但 NAS 跑的是旧的"）。
  #   · 走**直传**（本机 `docker save` → NAS `docker load`，免登录、绕开镜像站 tag 缓存）
  #     ⇒ 留默认 `missing`（本地已有该 sha tag 就直接用，**不去 registry 拉**）。
  #     旧的硬编码 `always` 会让直传路径**必然报错**（registry 上根本没这个 sha tag
  #     ⇒ `Head .../manifests/<sha>: EOF`）。
  #   ★ 部署点名**不可变 sha tag** 仍是铁律（ERR-DOCKER-13）——两种策略都遵守。
  pull_policy: ${PULL_POLICY:-missing}
  env_file: .env
  environment: &common-env
    # 状态目录统一指向 /data（下面 bind mount 过来的宿主机目录）
    - DATA_DIR=/data
    # network_mode: host 下没有 host.docker.internal 这条特殊 DNS 记录，
    # 容器直接共享宿主机网络栈，所以用宿主机自己访问 qB 的真实地址。
    # ★★ 2026-10-07（#92）：发种回加改走 **publish 实例(SSD)**，不再走 opencd(:3020)。
    #   · 为什么：发种是"高 IO + 短命 + 可校验"的活，与"长期保种"资源画像相反；
    #     publish 实例专做发种、落 SSD、限并发(MaxActiveDownloads=1) ⇒ 不挤保种、
    #     不触发下载态 mmap 爆炸。
    #   · 两条发种路径（乌托邦 readd_to_qb / 蟹黄堡 readd_to_qb_crabpt）共用 `config.QB_HOST`
    #     （唯一构造点 qb_client.build）⇒ 改这一处两路都走同一个发种实例。
    #   · ★ 生产 `.env` 里 `QB_HOST=http://127.0.0.1:3010`（本行兜底**也是** 3010，`.env` 优先）。
    #   · ★★★ 2026-10-18（C1，ERR-META-33）：本行兜底原先写 3040，与生产真值(3010)**不一致**
    #     ⇒ `.env` 一旦漏了这一行就**静默**连到 3040 那个别的实例。现三处统一：
    #     本文件两处 + `src/config.py` 的 `QB_HOST_DEFAULT`。★ 改一处必须改另外两处。
    #   · ★★ 2026-10-10（#16，ERR-ORCH-02）：**scan 不读本值** —— scan 读皇后源，
    #     走 `QB_HOST_OPENCD`（经 `env_file: .env` 传进来，**故意不在这里写第二遍**：
    #     写两处 = 两个真值来源，正是 ERR-ORCH-02 的病根）。
    #   · ★ 回滚：改回**当时那个发种实例**的端口，并同步改另一处 + `config.QB_HOST_DEFAULT`。
    - QB_HOST=${QB_HOST:-http://127.0.0.1:3010}
    # ★ 上面那个只读挂载的落点。`sync_opencd_tid.py` 读它（容器内路径）。
    #   写在这里而不是 .env：它是**挂载点的配对**，改一处不改另一处必然出错；
    #   放同一份文件里，改挂载的人一定看得见它。（.env 里另有 VERTEX_DB 的
    #   同名键只为本机跑自检用，两者互不覆盖 —— 本地 .env 不进容器。）
    - VERTEX_DB=/vertex/sql.db
  volumes: &common-volumes
    # 状态（data.db / output_torrents / daemon_state.json / readd_queue.json /
    # lsky_token.json / covers / raw_html …）统一放在 `${STATE_DIR:-./data}` 子目录，
    # 与 compose 文件本身的目录**分开** —— 这样：
    #   · 与 `data/` 平级的只剩容器定义类文件（compose / Dockerfile / .env / README）；
    #   · 状态可整目录备份/搬移，不会和源码混在一起。
    # 而不是匿名命名卷：SMB 上直接看得到、能备份，出问题也能直接查库。
    # 那份已经回填好 254 个站点 ID 的 data.db 就在 `data/` 里，不需要任何迁移。
    - ${STATE_DIR:-./data}:/data
    # 抽元数据、找封面要读音乐文件，只读挂载
    - ${MUSIC_DIR:-/volume1/video/music}:/downloads:ro
    - ${INCOMPLETE_DIR:-/volume2/qb_temp/temp_docker_opencd}:/downloads/incomplete:ro
    # ★★ 2026-10-07（#92-f1/#133）：发种成品区 —— ★★ **落点订正**：宿主侧必须是 **3040 看得见的目录**！
    #   · 原先挂 `${PUBLISH_DIR}:/publish`（= 本项目**自己**的 publish_data）⇒ 复制过去的东西
    #     **3040 根本看不到**（3040 的 /downloads 是另一个宿主目录）⇒ 三条种补救要手工 cp 的根因。
    #   · 订正后：把**宿主 3040 的 Download 目录**挂到本项目容器内（rw），让本项目能**写**进去
    #     ⇒ 复制 = 直接写进 3040 的 /downloads；3040 加种用 `save_path=/downloads`（父目录语义）。
    #   · ★ 容器内路径仍叫 `/publish`（= `config.PUBLISH_CONTAINER_DIR`，与本项目代码对齐）；
    #     ★★ 真正要紧的是**宿主侧**（= 3040 的 Download）—— 容器内叫什么都行，只要代码同值。
    #   · ⚠️ **不能**挂到容器内 `/downloads`：那里已被上面的 `${MUSIC_DIR}:/downloads:ro` 占着
    #     （同一个容器挂两个 /downloads ⇒ docker 只认一个）。所以用独立的 `/publish`。
    #   · ⚠️⚠️ **必须写在 `volumes:` 段里** —— 曾误写进 `environment:` 段，
    #     那样 `- KEY:VALUE` 会被当成**环境变量**（compose 不报错、也不挂载）⇒ 静默失效。
    #   · ★★ 铁律：本挂载的宿主目录**就是 3040 的下载根** ⇒ "清 SSD"只删 `<本目录>/<专辑>` 子目录，
    #     绝不删本目录本身（`handoff._safe_rmtree` 有护栏，护栏①即为此）。
    #   · ★ 回滚：删掉本行（则 enqueue/复制没有可见落点，交棒不成立）。
    - ${PUBLISH_DIR:-/volume2/docker_ssd/qbit-publish/Download}:/publish
    # 挂载宿主机媒体根目录（只读），保证与 qbit-publish 拥有对等的文件系统可见性，支撑软链接校验与交棒清盘
    - /volume1/video:/volume1/video:ro
    # ★★ vertex2（另一个项目）的库，只读挂进来 —— `sync_opencd_tid.py` 靠它按
    #   infohash 找出皇后的 `details.php?id=`。它是本项目**唯一的 id 来源**。
    #   ★ 挂的是**目录**不是文件：sync_opencd_tid.py 期望的路径是
    #     `/vertex/sql.db`（库会和它旁边的 -wal/-shm 一起被 SQLite 用到，
    #     只挂单个文件会漏掉那两个伴随文件）。
    #   ★ `:ro` 是硬要求 —— 我们**没有任何理由**写别人的库，而只读挂载让
    #     "手滑写坏 vertex2" 从"靠自律"变成"内核拒绝"。SQLite 打开时还会
    #     自己加 `mode=ro` + `query_only=1`（见该脚本纪律 5），双保险。
    #   ★ 默认值是**部署时实测过的**；对不上就报 `外部库不存在` 而非静默跳过
    #     （该脚本纪律 4：源读不到 ⇒ 非零退出）。
    - ${VERTEX_DB_DIR:-/volume2/docker_ssd/vertex2/vertex/db}:/vertex:ro
  # 共享宿主机网络：既能到 127.0.0.1 的 qB，也能正常出网访问站点和图床
  network_mode: "host"

services:
  # ==================== 常驻编排器（唯一需要长期运行的） ====================
  musopia:
    <<: *common
    container_name: opencd2musopia
    command: ["python", "daemon.py"]
    restart: unless-stopped

    # 收到 SIGTERM 后 daemon 会等当前阶段收尾再退出。默认 10s 往往不够
    # （一次编辑请求 + 校验回读可能十几秒），硬杀会留下改了一半的页面。
    stop_grace_period: 5m

    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3

    # 日志别无限涨，NAS 上很容易被慢慢填满
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ==================== 以下都是手动一次性任务 ====================
  # 加了 profiles 就不会被 docker compose up 带起来，只能显式 run。
  # 用法示例：
  #   docker compose run --rm tools python check_db.py
  #   docker compose run --rm tools python sync_site.py --apply
  #   docker compose run --rm tools python update_metadata.py 14611 --apply --verify
  tools:
    <<: *common
    profiles: ["tools"]
    container_name: musopia_tools
    command: ["python", "check_db.py"]
    restart: "no"

  # 只跑一轮全部阶段就退出（首次部署时验证配置对不对，比直接常驻更容易看结果）
  once:
    <<: *common
    profiles: ["tools"]
    container_name: musopia_once
    command: ["python", "daemon.py"]
    restart: "no"
    environment:
      - DATA_DIR=/data
      - QB_HOST=${QB_HOST:-http://127.0.0.1:3010}
      # 全阶段跑一轮后就不再有到期任务；配合 DRY_RUN=true 可做无副作用演练
      - RUN_ON_START=true
      - DRY_RUN=${DRY_RUN:-true}
